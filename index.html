<script>
"use strict";

const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Memoria del dispositivo piena: esporta un backup.')}}};

/* ============================================================ archivio (Apps Script) */

try{const q=new URLSearchParams(location.search).get('archivio');if(q&&q!==API.url){API={url:q};ls.set('ts-api',API)}}catch(e){}
/* indirizzo dell'archivio: accetta anche testo incollato con spazi, senza https o con altro intorno */
function pulisciArchivio(raw){raw=String(raw||'').trim();const m=/(?:https?:\/\/)?script\.google(?:usercontent)?\.com\/[^\s"'<>»)]+/i.exec(raw);
  if(m)return('https://'+m[0].replace(/^https?:\/\//i,'')).replace(/[.,;]+$/,'');const l=/^https?:\/\/localhost[:\/]\S*/i.exec(raw);return l?l[0]:''}

async function api(action,payload={}){
  if(!API.url)throw err('Archivio non impostato','no_url');

function usShape(ctx,k,lw,cx,cy,em,lab,kind,bold){
  const house=kind==='struttura';
  ctx.font=(bold?'bold ':'')+(em*k)+'px '+SF;const tw=ctx.measureText(lab).width,cap=0.72*em*k,h=cap+0.75*em*k;
  if(house)cy+=h*0.55/2; /* la casetta intera resta centrata */
  ctx.fillStyle='#000';ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillText(lab,cx,cy+cap/2);
  ctx.strokeStyle='#000';ctx.lineWidth=lw;ctx.setLineDash([]);ctx.beginPath();let w;
  if(kind==='negativa'){w=tw+0.7*em*k;ctx.rect(cx-w/2,cy-h/2,w,h)}
  else if(house){w=tw+0.8*em*k;const roof=h*0.55,top=cy-h/2,bot=cy+h/2;
    ctx.moveTo(cx-w/2,bot);ctx.lineTo(cx+w/2,bot);ctx.lineTo(cx+w/2,top);ctx.lineTo(cx,top-roof);ctx.lineTo(cx-w/2,top);ctx.closePath()}
  else{w=tw+1.15*em*k;ctx.ellipse(cx,cy,w/2,h/2,0,0,Math.PI*2)}
  ctx.stroke();return{w,h};
}

const NUMW={zero:0,un:1,uno:1,una:1,due:2,tre:3,'tré':3,quattro:4,cinque:5,sei:6,sette:7,otto:8,nove:9,dieci:10,undici:11,dodici:12,tredici:13,quattordici:14,quindici:15,sedici:16,diciassette:17,diciotto:18,diciannove:19};
const DECW={venti:20,trenta:30,quaranta:40,cinquanta:50,sessanta:60,settanta:70,ottanta:80,novanta:90};
function parolaNum(w){let n=0,s=w;
  if(/^cento/.test(s)){n=100;s=s.slice(5);if(!s)return 100}
  else{const m=s.match(/^(due|tre|quattro|cinque|sei|sette|otto|nove)cento/);if(m){n=NUMW[m[1]]*100;s=s.slice(m[0].length);if(!s)return n}}
  if(s in NUMW)return n+NUMW[s];
  for(const d in DECW){const r=d.slice(0,-1);if(s===d)return n+DECW[d];
    if(s.indexOf(d)===0||s.indexOf(r)===0){const rest=s.indexOf(d)===0?s.slice(d.length):s.slice(r.length);
      if(rest in NUMW&&NUMW[rest]<10)return n+DECW[d]+NUMW[rest];if(s.indexOf(r)===0&&(rest==='uno'||rest==='otto'))return n+DECW[d]+NUMW[rest]}}
  return null}
function interpretaDettato(testo){
  let t=' '+String(testo||'').toLowerCase().replace(/[’']/g,' ')+' ';
  t=t.replace(/[a-zàèéìòù]+/g,w=>{const n=parolaNum(w);return n==null||w==='un'||w==='una'?w:String(n)});
  t=t.replace(/(\d)\s*,\s*(\d)/g,'$1.$2');
  t=t.replace(/\bunit[aà]\s+stratigrafic[ah]e?\b|\bu\.?\s?s\.?(?=\s|\d|$)|\busa\b|\buso\b|\bu\s+esse\b|\bus\b/g,' US ');
  const out={tipo:null,trincea:null,sezione:null,strati:[],avvisi:[]};
  const h=t.match(/\b(trincea|sondaggio|saggio|settore)\s*(?:numero|n\.?)?\s*(\d+[a-z]?)\b/);if(h){out.tipo=h[1].toUpperCase();out.trincea=h[2]}
  const sz=t.match(/\bsezione\s*(?:numero|n\.?)?\s*(\d+[a-z]?)\b/);if(sz)out.sezione=sz[1];
  t.split(/\bUS\b/).slice(1).forEach(p=>{
    const m=p.match(/^\s*(?:numero|n\.?)?\s*(\d+[a-z]?)\b(.*)$/);if(!m){out.avvisi.push('Numero di US non capito in: “US'+p.trim().slice(0,30)+'”');return}
    let us=m[1],r=m[2],cm=null,descr='';
    const dm=r.match(/\bdescrizione\b\s*[:,]?\s*(.*)$/);if(dm){descr=dm[1];r=r.slice(0,dm.index)}
    const mc=r.match(/(\d+(?:\.\d+)?)\s*metr[oi]\s*e\s*(\d+)/);
    if(mc)cm=parseFloat(mc[1])*100+parseFloat(mc[2]);
    else{const mm=r.match(/(\d+(?:\.\d+)?)\s*(centimetri|centimetro|cm|metri|metro|mt|m)?\b/);if(mm){const v=parseFloat(mm[1]),u=mm[2]||'';cm=/^m|^mt/.test(u)?v*100:(!u&&v<5&&mm[1].includes('.')?v*100:v)}}
    if(cm==null)out.avvisi.push('Manca lo spessore della US '+us);
    descr=descr.replace(/\s+/g,' ').replace(/[\s,;.\-–]+$/,'').trim();if(descr)descr=descr[0].toUpperCase()+descr.slice(1);
    out.strati.push({us:us.toUpperCase(),cm:cm==null?'':String(Math.round(cm*10)/10),descr})});
  return out;
}
function dettPreview(r){
  const a=[];if(r.tipo)a.push(`<span class="k">${esc(r.tipo+' '+r.trincea+(r.sezione?' · Sez. '+r.sezione:''))}</span>`);
  let tt=0;r.strati.forEach(s=>{tt+=num(s.cm);a.push(`<span class="${s.cm===''?'bad':''}">${esc('US '+s.us+' · '+(s.cm===''?'?':s.cm+' cm')+(s.descr?' · '+s.descr:''))}</span>`)});
  if(r.strati.length)a.push(`<span class="k">Totale ${(tt/100).toFixed(2)} m</span>`);
  r.avvisi.forEach(x=>a.push(`<span class="bad">${esc(x)}</span>`));return a.join('');
}

const CRC=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=b=>{let c=0xffffffff;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xffffffff)>>>0};
const blobOf=(c,type,q)=>new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('immagine')),type,q));
async function sezPng(s){await fontsReady();const b=new Uint8Array(await (await blobOf(sezCanvas(s,G.PXM),'image/png')).arrayBuffer());
  const ppm=Math.round(300/0.0254),ch=new Uint8Array(21),dv=new DataView(ch.buffer);dv.setUint32(0,9);ch.set([112,72,89,115],4);dv.setUint32(8,ppm);dv.setUint32(12,ppm);ch[16]=1;dv.setUint32(17,crc(ch.subarray(4,17)));
  const out=new Uint8Array(b.length+21);out.set(b.subarray(0,33));out.set(ch,33);out.set(b.subarray(33),54);return new Blob([out],{type:'image/png'})}

  if(b[6]===74&&b[7]===70&&b[8]===73&&b[9]===70){b[13]=1;b[14]=1;b[15]=44;b[16]=1;b[17]=44}return new Blob([b],{type:'image/jpeg'})}
const libs={};
function loadLib(url,glob){if(window[glob])return Promise.resolve(window[glob]);if(libs[url])return libs[url];
  libs[url]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=url;s.onload=()=>res(window[glob]);s.onerror=()=>{delete libs[url];rej(err('La prima volta serve la connessione per preparare i PDF.','offline'))};document.head.append(s)});return libs[url]}

  const D={page:()=>{if(!first)pdf.addPage();first=false},
    rect:(x0,y0,x1,y1,col,fill)=>{if(fill){pdf.setFillColor(...col);pdf.rect(x0,y0,x1-x0,y1-y0,'F')}else{pdf.setLineWidth(0.6);pdf.setDrawColor(0,0,0);pdf.rect(x0,y0,x1-x0,y1-y0)}},

      :`<div class="grid12">${sec.f.map(field).join('')}${sec.desc?`<div class="c12 row"><span class="note" id="descNota" style="flex-basis:100%"></span><button class="sm" id="compose">Torna alla descrizione automatica</button>${API.ai?'<button class="sm" id="orto">Controlla l’ortografia</button>':''}<span class="msg" id="ortoMsg"></span></div><div class="c12" id="ortoRev"></div>`:''}</div>`}</details>`).join('')}

  </div>`;
  /* descrizione che si compone da sola mentre si compilano le caselle; se la modifichi a mano resta la tua */
  const comp=()=>composeDesc({...r,tipo:'US'});

  const descStato=()=>{const n=$('#descNota'),b=$('#compose');if(n)n.textContent=r.descAuto?'Si scrive da sola mentre compili le caselle (definizione, componenti, colore, consistenza…). Se la modifichi a mano, resta la tua.':'Descrizione modificata a mano: le caselle non la cambiano più.';if(b)b.hidden=!!r.descAuto};
  const aggiornaDesc=()=>{if(!r.descAuto)return;const t=comp(),ta=$('[data-uf="descrizione"]');r.descrizione=t;if(ta&&document.activeElement!==ta)ta.value=t};
  $$('[data-uf]').forEach(e=>e.addEventListener(e.tagName==='SELECT'?'change':'input',()=>{const k=e.dataset.uf;r[k]=e.value;
    if(k==='descrizione')r.descAuto=!e.value.trim();else if(DESC_SRC.includes(k))aggiornaDesc();descStato();save()}));
  bindPick($('#main'),k=>k==='responsabile'?[...new Set([...usOf(sc.id).map(u=>u.responsabile),me().nome].filter(Boolean))]:vociFor(k,sc.id),MULTI);
  /* avviso quando una voce scritta a mano somiglia a una dell'elenco */
  const simili=e=>{const k=e.dataset.uf,box=$(`[data-sim="${k}"]`);if(!box)return;const ss=vociSimili(e.value,vociFor(k,sc.id,r.id),MULTI.has(k));
    box.innerHTML=ss.map((x,i)=>`<div class="hint-row">«${esc(x.da)}» somiglia a «${esc(x.a)}», già nell'elenco. <button type="button" class="sm" data-usa="${i}">Usa «${esc(x.a)}»</button><button type="button" class="sm ghost" data-lascia="${i}">Lascia così</button></div>`).join('');
    box.querySelectorAll('[data-usa]').forEach(b=>b.onclick=()=>{const x=ss[+b.dataset.usa];
      e.value=MULTI.has(k)?tk(e.value).map(t=>t===x.da?x.a:t).join(', '):x.a;e.dispatchEvent(new Event('input',{bubbles:true}));simili(e)});
    box.querySelectorAll('[data-lascia]').forEach(b=>b.onclick=()=>b.closest('.hint-row').remove())};
  $$('[data-uf]').forEach(e=>{if(VOCI[e.dataset.uf])e.addEventListener('change',()=>simili(e))});
  document.querySelectorAll('.usPick[data-pl]').forEach(pl=>pl.addEventListener('click',()=>{const e=pl.previousElementSibling&&pl.previousElementSibling.querySelector('[data-uf]');if(e)setTimeout(()=>simili(e),0)}));
  /* controllo ortografico della descrizione con Claude (con la chiave API): proposte da accettare */
  const ob=$('#orto');if(ob)ob.onclick=async()=>{const ta=$('[data-uf="descrizione"]'),t=ta.value.trim(),m=$('#ortoMsg');if(!t)return;
    m.innerHTML='<span class="spin"></span>Controllo…';m.className='msg';
    try{const j=await api('correggiTesto',{testo:t});const mod=(j.modifiche||[]).filter(x=>x.da&&x.a&&x.da!==x.a&&t.includes(x.da));
      if(!mod.length){m.textContent='Nessun errore trovato.';$('#ortoRev').innerHTML='';return}
      m.textContent=`${mod.length} correzion${mod.length===1?'e':'i'} propost${mod.length===1?'a':'e'}: scegli quali applicare.`;
      $('#ortoRev').innerHTML=`<div class="derived">${mod.map((x,i)=>`<label class="row small"><input type="checkbox" data-om="${i}" checked style="width:auto;min-height:auto"> <s>${esc(x.da)}</s> → <b>${esc(x.a)}</b></label>`).join('')}
        <div class="row"><button class="sm primary" id="oOk">Applica</button><button class="sm" id="oNo">Annulla</button></div></div>`;
      $('#oNo').onclick=()=>{$('#ortoRev').innerHTML='';m.textContent=''};
      $('#oOk').onclick=()=>{let v=ta.value;mod.forEach((x,i)=>{if($(`[data-om="${i}"]`).checked)v=v.split(x.da).join(x.a)});ta.value=v;r.descrizione=v;saveUs(r);$('#ortoRev').innerHTML='';m.textContent='Correzioni applicate.'}}
    catch(e){m.textContent=e.code==='bad_request'?'Aggiorna lo script dell’archivio (Code.gs) per usare il controllo con Claude.':e.message;m.className='msg err'}};
  $$('[data-rel]').forEach(e=>e.addEventListener('change',()=>{setRel(r,e.dataset.rel,e.value);e.value=joinNums(r.rel[e.dataset.rel]);saveUs(r)}));
  $$('[data-seg]').forEach(b=>b.onclick=()=>{r.segno=b.dataset.seg;$$('[data-seg]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));save()});
  $$('[data-st]').forEach(b=>b.onclick=()=>{r.stato=b.dataset.st;$$('[data-st]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));save()});
  $('#uNum').onchange=e=>{const nn=normNum(e.target.value);if(!nn){e.target.value=r.numero;return toast('Il numero è obbligatorio.')}
    if(nn!==normNum(r.numero)&&findUs(sc.id,nn)){e.target.value=r.numero;return toast(`La US ${nn} esiste già in questo scavo.`)}
    const old=normNum(r.numero);r.numero=nn;saveUs(r);
    usOf(sc.id).forEach(t=>{if(t.id===r.id||!t.rel)return;let ch=false;Object.keys(t.rel).forEach(k=>{if(t.rel[k].includes(old)){t.rel[k]=t.rel[k].map(x=>x===old?nn:x);ch=true}});if(ch)saveUs(t)});
    sezioniScavo(sc.id).forEach(s=>{if((s.strati||[]).some(x=>normNum(x.us)===old)){const {id,...dd}=s;dd.strati=dd.strati.map(x=>normNum(x.us)===old?{...x,us:nn}:x);put('sezioni/'+id,dd)}});
    toast(`Numero cambiato in ${nn}, anche nelle sezioni e nei rapporti.`)};
  const ap=$('#applyRel');if(ap)ap.onclick=()=>{missRel.forEach(([k,a])=>setRel(r,k,[...((r.rel&&r.rel[k])||[]),...a]));saveUs(r);render()};
  /* descrizione dettata → voci della scheda, sempre da verificare prima di inserirle */
  $('#quickGo').onclick=async()=>{const t=$('#quick').value.trim();if(!t)return;const m=$('#quickMsg');m.className='msg';
    const lists=Object.fromEntries(Object.keys(VOCI).map(k=>[k,vociFor(k,sc.id)]));let x=null,fonte='sul dispositivo';
    if(API.ai&&navigator.onLine){m.innerHTML='<span class="spin"></span>Leggo la descrizione…';
      try{x=await api('estraiDescrizione',{testo:t,voci:Object.fromEntries(Object.entries(lists).map(([k,v])=>[k,v.slice(0,60)]))});fonte='con Claude'}catch(e){x=null}}
    if(!x)x=localExtract(t,'US',lists);
    x={...x};if(x.artificiali){x.geologici=[...new Set([...tk(x.geologici),...tk(x.artificiali)])].join(', ');delete x.artificiali} /* nella scheda ICCD gli artificiali stanno tra gli inorganici */
    const LAB=Object.fromEntries(SCH.flatMap(sec=>(sec.f||[]).map(f=>[f[0],f[1]])));
    const rows=[];
    Object.entries(x).forEach(([k,v])=>{if(k==='rel'){Object.entries(v||{}).forEach(([rk,arr])=>{arr=parseNums(arr).filter(n=>!((r.rel&&r.rel[rk])||[]).includes(n));if(arr.length&&RELLAB[rk])rows.push({k:'rel:'+rk,lab:RELLAB[rk],v:arr.join(', '),cur:joinNums(r.rel&&r.rel[rk]),on:true})});return}
      if(k==='segno'&&['positiva','negativa','struttura'].includes(v)&&v!==(r.segno||'positiva')){rows.push({k,lab:'Tipo di unità',v,cur:r.segno||'positiva',on:true});return}
      if(!LAB[k]||v==null||!String(v).trim())return;v=String(v).trim();const cur=String(r[k]||'').trim();if(cur.toLowerCase()===v.toLowerCase())return;
      rows.push({k,lab:LAB[k],v,cur,on:!cur})});
    if(!rows.length){m.textContent='Nessuna voce nuova trovata nella descrizione.';$('#quickRev').innerHTML='';return}
    m.textContent=`Estratte ${rows.length} voci (${fonte}). Controlla e spunta quelle da inserire: le voci con un valore già presente sono deselezionate.`;
    $('#quickRev').innerHTML=`<div class="derived">${rows.map((w,i)=>`<label class="qrow"><input type="checkbox" data-q="${i}" ${w.on?'checked':''}>
      <span class="ql">${esc(w.lab)}</span><input class="qv" data-qv="${i}" value="${esc(w.v)}">${w.cur?`<span class="qc">ora: ${esc(w.cur)}${w.k.startsWith('rel:')?' (si aggiunge)':' (verrà sostituito)'}</span>`:''}</label>`).join('')}
      <div class="row"><button class="primary sm" id="qOk">Inserisci le voci spuntate</button><button class="sm" id="qNo">Annulla</button></div></div>`;
    $('#qNo').onclick=()=>{$('#quickRev').innerHTML='';m.textContent=''};
    $('#qOk').onclick=()=>{const done=[];rows.forEach((w,i)=>{if(!$(`[data-q="${i}"]`).checked)return;const v=$(`[data-qv="${i}"]`).value.trim();if(!v)return;
        if(w.k.startsWith('rel:')){const rk=w.k.slice(4);setRel(r,rk,[...((r.rel&&r.rel[rk])||[]),...parseNums(v)])}else{r[w.k]=v;if(w.k==='descrizione')r.descAuto=false}done.push(w.lab.toLowerCase())});
      if(r.descAuto!==false&&!done.includes('descrizione'))r.descrizione=composeDesc({...r,tipo:'US'});saveUs(r);render();const mm=$('#quickMsg');if(mm)mm.textContent=done.length?'Inserito: '+done.join(' · '):'Nessuna voce inserita.'};
  };
  $('#compose').onclick=()=>{r.descAuto=true;aggiornaDesc();if(!r.descrizione)toast('Compila definizione, componenti, colore o consistenza: la descrizione si forma da sola.');descStato();save()};
  descStato();
  const msg=(t,e)=>{const m=$('#uMsg');m.textContent=t;m.className='msg'+(e?' err':'')};
  $('#pdf').onclick=async()=>{clearTimeout(usSaveT);saveUs(r);msg('Preparo il PDF…');try{await offerFile(usPdfName(r),await schedePdf([r],sc));msg('')}catch(e){msg(e.message,true)}};
  $('#pdfDrv').onclick=async()=>{clearTimeout(usSaveT);saveUs(r);msg('Salvo…');try{const j=await toDrive(sc,'Schede PDF',usPdfName(r),await schedePdf([r],sc));msg('Salvata in '+j.cartella)}catch(e){msg(e.message,true)}};
  $('#delUs').onclick=()=>{$('#delBox').innerHTML=`<div class="confirm"><span>Eliminare la scheda US ${esc(r.numero)}? I rapporti delle altre US verso questa restano da correggere a mano.</span><button class="sm danger" id="delY">Elimina</button><button class="sm" id="delN">Annulla</button></div>`;
    $('#delY').onclick=()=>{remove('us/'+r.id);S.view=null;render()};$('#delN').onclick=()=>$('#delBox').innerHTML=''};
}

/* ---------- esporta */

      <div class="row"><button class="primary" id="zipSez">Cartella SEZIONI (.zip)</button><button id="pdfSez">Tutte in un unico PDF</button></div>
      <div class="row"><button id="drvSez">Salva tutte nella cartella dello scavo</button></div>
      <p class="note">300 dpi, strati larghi 3 m in scala 1:15, come i disegni Rhino. I file si chiamano «TRINCEA 4 - SEZIONE 1»; nel disegno il titolo è «TRINCEA 4, SEZIONE 1».</p>
      <span class="msg" id="mSez"></span></section>
    <section class="panel"><h3>Schede US (${list.length})</h3>
      <label class="row"><input type="checkbox" id="soloComp" style="width:auto;min-height:auto"> Solo le schede completate</label>
      <div class="row"><button class="primary" id="pdfUs">Tutte in un unico PDF</button><button id="zipUs">Un PDF per US (.zip)</button></div>
      <div class="row"><button id="drvUs">Salva un PDF per US nella cartella dello scavo</button></div>

    let n=0;Object.entries(j.docs).forEach(([p,d])=>{if(p.startsWith('scavi/')&&!canEditScavo())return;put(p,d);n++});if(j.scavo)S.cur=j.scavo;say('mDat',`Ripristinati ${n} elementi.`);renderTabs()}catch(x){say('mDat',esc(x.message),true)}};

      ${ed?(sc?'<p class="note">Le modifiche si salvano da sole.</p>':'<div><button class="primary" id="creaScavo">Crea lo scavo</button></div>'):'<p class="note">Solo responsabile e soci modificano i dati dello scavo.</p>'}

      <p class="note">Ultima sincronizzazione: ${S.lastSync?new Date(S.lastSync).toLocaleString('it-IT'):'—'}${S.outbox.length?` · ${S.outbox.length} modifiche in attesa di invio`:''}</p>
      <div class="row"><button id="syncNow">Sincronizza ora</button><button class="danger" id="logout">Esci</button></div>
      <div id="outBox"></div>
    </section></div>`;
  const data=()=>Object.fromEntries($$('[data-sf]').map(e=>[e.dataset.sf,e.value.trim()]));

  if(sc&&ed)$$('[data-sf]').forEach(e=>e.oninput=()=>{clearTimeout(e._t);e._t=setTimeout(()=>{const {id,...old}=curScavo();put('scavi/'+sc.id,{...old,...data()});renderTabs()},500)});
  const c=$('#creaScavo');if(c)c.onclick=()=>{const d=data();if(!d.localita&&!d.cantiere)return toast('Scrivi almeno la località o il cantiere.');const id=uid('sc');put('scavi/'+id,d);S.cur=id;nuovoScavo=false;S.tab='trincee';persist();render()};
  $('#syncNow').onclick=()=>sync().then(()=>render());
  $('#logout').onclick=()=>{if(S.outbox.length){$('#outBox').innerHTML=`<div class="confirm"><span>Ci sono ${S.outbox.length} modifiche non ancora inviate: uscendo restano su questo dispositivo e partono al prossimo accesso con lo stesso archivio.</span><button class="sm danger" id="lgY">Esci comunque</button></div>`;$('#lgY').onclick=doLogout;return}doLogout()};
}
function doLogout(){api('logout').catch(()=>{});API={url:API.url};ls.set('ts-api',API);render()}

/* ============================================================ controlli sui dati letti o dettati */
/* b = {tipo,trincea,sezione,strati:[{us,cm,descr}]}; restituisce [{sev:'err'|'warn'|'info', t}] */
function controlli(sc,b){
  const out=[],add=(sev,t)=>out.push({sev,t});
  const tipo=(b.tipo||'TRINCEA').toUpperCase(),trN=normNum(b.trincea);
  if(!trN)add('err','Manca il numero della trincea.');
  const tr=trN&&trinceeOf(sc).find(t=>(t.tipo||'TRINCEA')===tipo&&normNum(t.numero)===trN);
  if(trN&&!tr)add('info',`${tipo} ${trN} non esiste ancora: verrà creata.`);
  if(tr&&b.sezione&&sezioniOf(tr.id).some(s=>normNum(s.numero)===normNum(b.sezione)))add('warn',`La sezione ${b.sezione} della ${tipo} ${trN} esiste già: la nuova avrà il primo numero libero.`);
  if(!b.sezione)add('info','Numero di sezione non indicato: verrà dato il primo libero.');
  const st=b.strati||[];if(!st.length)add('err','Nessuno strato.');
  const seen={};let tot=0;
  st.forEach((x,i)=>{const n=normNum(x.us),cm=num(x.cm);tot+=cm;
    if(!n)add('err',`Strato ${i+1}: manca il numero di US.`);
    if(String(x.cm).trim()===''||cm<=0)add('err',`US ${n||'?'}: manca lo spessore.`);
    else if(cm>300)add('warn',`US ${n}: spessore di ${cm} cm, insolito.`);
    else if(cm<2)add('warn',`US ${n}: spessore di ${cm} cm, molto sottile.`);
    if(n&&seen[n])add('warn',`US ${n} compare due volte nella stessa sezione.`);seen[n]=1;
    const u=n&&findUs(sc,n);
    if(u&&x.descr&&u.breve&&u.breve.trim().toLowerCase()!==String(x.descr).trim().toLowerCase())add('warn',`US ${n} è già descritta come «${u.breve}»; qui risulta «${x.descr}». Resta la descrizione già registrata.`);
    if(n&&tr){const altrove=usInSezioni(sc,n).filter(w=>w.sez.trincea!==tr.id).map(w=>trShort(w.tr));if(altrove.length)add('info',`US ${n} compare già in ${[...new Set(altrove)].join(', ')}.`)}
    if(n&&!u)add('info',`US ${n} è nuova: verrà creata la scheda.`)});
  if(tot>500)add('warn',`Profondità totale di ${(tot/100).toFixed(2)} m, insolita.`);
  return out;
}
const ctrlHtml=l=>l.map(c=>`<span class="${c.sev==='err'?'bad':c.sev==='warn'?'wrn':''}">${esc(c.t)}</span>`).join('');

/* ============================================================ foto delle pagine del quaderno */
const IDB={db:null,open(){return this.db||(this.db=new Promise((res,rej)=>{const r=indexedDB.open('ts-foto',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async put(k,v){try{const d=await this.open();await new Promise((res,rej)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}},
  async get(k){try{const d=await this.open();return await new Promise(res=>{const q=d.transaction('f').objectStore('f').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}},
  async del(k){try{const d=await this.open();d.transaction('f','readwrite').objectStore('f').delete(k)}catch(e){}}};
const fotoOf=sc=>coll('foto').filter(f=>f.scavo===sc).sort((a,b)=>(b.creata||0)-(a.creata||0));
function saveFoto(f){const {id,...d}=f;put('foto/'+id,d)}
const FSTATO={'da inviare':['Salvata qui, parte con la rete','warn'],'da leggere':['In attesa di lettura','warn'],'da verificare':['Letta: da verificare','err'],'da trascrivere':['Da trascrivere a mano','warn'],'verificata':['Verificata','ok'],'trascritta':['Trascritta','ok']};
function riduciFoto(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const m=2400,sc=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('Immagine non leggibile')),'image/jpeg',0.85)};
  im.onerror=()=>rej(new Error('Formato immagine non leggibile: prova a scattare di nuovo.'));im.src=u})}
async function fotoBlob(f){let b=await IDB.get(f.id);if(b)return b;if(!f.driveId||!navigator.onLine)return null;
  const j=await api('getFile',{id:f.driveId});const bin=atob(j.base64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  b=new Blob([u8],{type:j.mime||'image/jpeg'});IDB.put(f.id,b);return b}
async function aggiungiFoto(file){
  const sc=curScavo();const blob=await riduciFoto(file);const id=uid('f');await IDB.put(id,blob);
  const d=new Date(),nome=`Pagina ${d.toLocaleDateString('it-IT').replace(/\//g,'-')} ${d.toTimeString().slice(0,5).replace(':','.')}`;
  put('foto/'+id,{scavo:sc.id,nome,stato:'da inviare',creata:Date.now(),autore:me().username||''});
  toast(navigator.onLine?'Foto salvata: la invio all’archivio…':'Foto salvata sul dispositivo: parte appena torna la rete.');
  render();setTimeout(processFoto,300);
}
let fotoBusy=false;
async function processFoto(){
  if(fotoBusy||!navigator.onLine||!API.token)return;fotoBusy=true;
  try{for(const f of coll('foto')){
    try{
      if(f.stato==='da inviare'){const blob=await IDB.get(f.id);if(!blob||S.outbox.some(o=>o.path==='scavi/'+f.scavo))continue;
        const j=await api('saveFile',{scavo:f.scavo,cartella:'Foto quaderno',name:f.nome+'.jpg',base64:await b64(blob),mime:'image/jpeg'});
        f.driveId=j.id;f.stato=API.ai?'da leggere':'da trascrivere';delete f.errore;saveFoto(f);softRender()}
      if(f.stato==='da leggere'&&API.ai&&f.driveId&&f.autore===me().username){
        const note=usOf(f.scavo).filter(u=>u.breve).map(u=>u.numero+': '+u.breve).join('; ');
        const r=await api('leggiFoto',{id:f.driveId,usNote:note});
        f.proposta=(r.sezioni||[]).map(s=>({tipo:String(s.tipo||'TRINCEA').toUpperCase(),trincea:String(s.trincea??''),sezione:String(s.sezione??''),
          strati:(s.strati||[]).map(x=>({us:normNum(x.us),cm:x.cm==null?'':String(x.cm),descr:String(x.descr||'')})),dubbi:(s.dubbi||[]).map(String)}));
        f.stato='da verificare';delete f.errore;saveFoto(f);toast('Pagina del quaderno letta: verifica i dati prima di salvarli.',5000);softRender()}
    }catch(e){if(e.code==='offline')break;f.errore=e.message;if(f.stato==='da leggere'&&e.code==='no_ai')f.stato='da trascrivere';saveFoto(f);softRender()}
  }}finally{fotoBusy=false}
}
function fotoPanel(sc){
  const l=fotoOf(sc.id).filter(f=>!['verificata','trascritta'].includes(f.stato)||(Date.now()-(f.creata||0))<3*864e5);
  return `<section class="panel lead">
    <h3>Dal quaderno</h3>
    <p class="note">Se piove o non puoi usare il tablet, scrivi sul quaderno e poi fotografa la pagina, anche senza rete: la foto resta qui e va nella cartella dello scavo appena c'è connessione. ${API.ai?'L’archivio la legge e prepara le sezioni: le salvi solo dopo averle verificate.':'Potrai aprirla accanto alla sezione mentre trascrivi i dati.'}</p>
    <div class="row"><input type="file" id="fotoIn" accept="image/*" hidden><button class="primary" id="fotoGo">Fotografa o carica la pagina</button></div>
    ${l.length?`<div class="fotos">${l.map(f=>{const st=FSTATO[f.stato]||[f.stato,''];return `<div class="foto"><b>${esc(f.nome)}</b>
      <span class="chip ${st[1]==='ok'?'completa':st[1]==='err'?'neg':'bozza'}">${esc(st[0])}</span>${f.errore?`<span class="msg err">${esc(f.errore)}</span>`:''}
      <div class="row">${f.stato==='da verificare'?`<button class="sm primary" data-act="verificaFoto" data-id="${esc(f.id)}">Verifica</button>`:''}
      <button class="sm" data-act="vediFoto" data-id="${esc(f.id)}">Apri</button>
      ${f.stato==='da trascrivere'?`<button class="sm" data-act="fotoFatta" data-id="${esc(f.id)}">Segna trascritta</button>`:''}
      ${API.ai&&['da trascrivere','verificata'].includes(f.stato)&&f.driveId?`<button class="sm" data-act="rileggiFoto" data-id="${esc(f.id)}">Leggi</button>`:''}</div></div>`}).join('')}</div>`:''}
  </section>`;
}
async function vediFoto(id){
  const f=S.docs['foto/'+id];if(!f)return;let b=null;try{b=await fotoBlob({...f,id})}catch(e){}
  if(!b)return toast('La foto non è su questo dispositivo: serve la rete per scaricarla dall’archivio.');
  const u=URL.createObjectURL(b),ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="ov-bar"><b>${esc(f.nome)}</b><span class="spacer"></span><button class="sm" id="ovZ">Ingrandisci</button><button class="sm primary" id="ovX">Chiudi</button></div><div class="ov-img"><img src="${u}" alt="${esc(f.nome)}"></div>`;
  document.body.append(ov);let z=false;
  ov.querySelector('#ovZ').onclick=()=>{z=!z;ov.querySelector('img').style.width=z?'250%':'';ov.querySelector('#ovZ').textContent=z?'Adatta':'Ingrandisci'};
  ov.querySelector('#ovX').onclick=()=>{ov.remove();URL.revokeObjectURL(u)};
}
/* schermata di verifica: foto accanto ai dati letti, tutti modificabili, con i controlli */
function renderVerifica(){
  const f0=S.docs['foto/'+S.openFoto];if(!f0||!f0.proposta){S.view=null;return render()}
  const sc=curScavo(),f={...JSON.parse(JSON.stringify(f0)),id:S.openFoto},P=f.proposta;
  $('#main').innerHTML=`<div class="stack">
    <div class="row"><button class="ghost" data-act="back">← Trincee</button><h2>Verifica la lettura</h2></div>
    <p class="note">Confronta ogni valore con la foto e correggi dove serve. Le sezioni vengono create solo quando premi «Conferma». In rosso gli errori da correggere, in arancio i punti da controllare.</p>
    <div class="two"><div class="sheet ver-img" data-act="vediFoto" data-id="${esc(f.id)}" title="Tocca per ingrandire"><img id="vImg" alt="Pagina del quaderno"></div>
    <div class="stack" id="vBlocks"></div></div>
    <div class="row"><button class="primary" id="vOk">Conferma e crea le sezioni</button><button id="vAdd">+ Sezione non letta</button><span class="spacer"></span><button class="danger" id="vNo">Scarta la lettura</button></div>
    <span class="msg" id="vMsg"></span></div>`;
  fotoBlob(f).then(b=>{if(b)$('#vImg').src=URL.createObjectURL(b)}).catch(()=>{});
  const draw=()=>{const box=$('#vBlocks');box.innerHTML='';
    P.forEach((b,bi)=>{const el=document.createElement('section');el.className='panel';
      const tot=(b.strati||[]).reduce((a,x)=>a+num(x.cm),0)/100;
      el.innerHTML=`<div class="grid12"><label class="f c4"><span>Tipo</span><select data-k="tipo">${['TRINCEA','SONDAGGIO','SAGGIO'].map(o=>`<option ${o===b.tipo?'selected':''}>${o}</option>`).join('')}</select></label>
        <label class="f c4"><span>Numero</span><input data-k="trincea" value="${esc(b.trincea)}" inputmode="numeric"></label><label class="f c4"><span>Sezione n.</span><input data-k="sezione" value="${esc(b.sezione)}" inputmode="numeric"></label></div>
        <div class="shdr"><span></span><span>US</span><span>Spess. cm</span><span>Descrizione letta</span><span></span></div>
        ${(b.strati||[]).map((x,i)=>`<div class="strato"><span class="mono small muted">${i+1}</span><input data-s="${i}" data-f="us" value="${esc(x.us)}" class="mono"><input data-s="${i}" data-f="cm" value="${esc(x.cm)}" class="num" inputmode="decimal"><input data-s="${i}" data-f="descr" value="${esc(x.descr)}" class="d"><button class="x" data-del="${i}" aria-label="Elimina strato">✕</button></div>`).join('')}
        <div class="row"><button class="sm" data-addst>+ Strato</button><span class="spacer"></span><span class="mono small">Totale ${tot.toFixed(2)} m</span></div>
        ${(b.dubbi||[]).length?`<div class="derived"><b>Dubbi segnalati nella lettura</b>${b.dubbi.map((d,j)=>`<label class="row small"><input type="checkbox" data-dub="${j}" style="width:auto;min-height:auto"> ${esc(d)} <span class="muted">(spunta se l'hai controllato)</span></label>`).join('')}</div>`:''}
        <div class="dprev ctrl">${ctrlHtml(controlli(sc.id,b))}</div>
        <div class="row"><span class="spacer"></span><button class="sm danger" data-delb>Togli questa sezione</button></div>`;
      const upd=()=>{el.querySelector('.ctrl').innerHTML=ctrlHtml(controlli(sc.id,b));f.proposta=P;saveFoto(f)};
      el.querySelectorAll('[data-k]').forEach(i=>i.oninput=i.onchange=()=>{b[i.dataset.k]=i.value.trim();upd()});
      el.querySelectorAll('[data-s]').forEach(i=>i.oninput=()=>{b.strati[+i.dataset.s][i.dataset.f]=i.dataset.f==='us'?normNum(i.value):i.value;upd()});
      el.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{b.strati.splice(+x.dataset.del,1);upd();draw()});
      el.querySelector('[data-addst]').onclick=()=>{b.strati.push({us:'',cm:'',descr:''});upd();draw()};
      el.querySelectorAll('[data-dub]').forEach(x=>x.onchange=()=>{b.ok=b.ok||{};b.ok[x.dataset.dub]=x.checked;upd()});
      el.querySelectorAll('[data-dub]').forEach(x=>{x.checked=!!(b.ok&&b.ok[x.dataset.dub])});
      el.querySelector('[data-delb]').onclick=()=>{P.splice(bi,1);upd();draw()};
      box.append(el)})};
  draw();
  $('#vAdd').onclick=()=>{P.push({tipo:'TRINCEA',trincea:'',sezione:'',strati:[{us:'',cm:'',descr:''}],dubbi:[]});f.proposta=P;saveFoto(f);draw()};
  $('#vNo').onclick=()=>{f.stato='da trascrivere';delete f.proposta;saveFoto(f);S.view=null;render()};
  $('#vOk').onclick=()=>{
    const errs=P.flatMap((b,i)=>controlli(sc.id,b).filter(c=>c.sev==='err').map(c=>`Sezione ${i+1}: ${c.t}`));
    if(!P.length)return toast('Nessuna sezione da creare.');
    if(errs.length){const m=$('#vMsg');m.textContent='Correggi prima: '+errs.join(' ');m.className='msg err';return}
    const ids=[];
    P.forEach(b=>{let t=trinceeOf(sc.id).find(x=>(x.tipo||'TRINCEA')===b.tipo&&normNum(x.numero)===normNum(b.trincea));
      if(!t){const id=uid('t');put('trincee/'+id,{scavo:sc.id,tipo:b.tipo,numero:normNum(b.trincea)});t={id}}
      const num0=b.sezione&&!sezioniOf(t.id).some(s=>normNum(s.numero)===normNum(b.sezione))?normNum(b.sezione):'';
      const aperti=(b.dubbi||[]).filter((d,j)=>!(b.ok&&b.ok[j]));
      const s=newSezione(t.id,num0,b.strati,aperti);const {id,...d}=s;d.foto=f.id;put('sezioni/'+id,d);ids.push(id)});
    f.stato='verificata';f.sezioni=ids;saveFoto(f);toast(`Create ${ids.length} sezion${ids.length===1?'e':'i'} dalla pagina del quaderno.`);S.view=null;render()};
}

/* ---------- azioni */

  goNuovoScavo(){nuovoScavo=true;S.tab='scavo';S.view=null;render()},
  nuovaTrincea(){const sc=curScavo(),tipo=$('#ntTipo').value,n=normNum($('#ntNum').value);if(!n)return toast('Scrivi il numero della trincea.');
    if(trinceeOf(sc.id).some(t=>t.tipo===tipo&&normNum(t.numero)===n))return toast(`${tipo} ${n} esiste già.`);put('trincee/'+uid('t'),{scavo:sc.id,tipo,numero:n});render()},
  delTrincea(d){remove('trincee/'+d.id);render()},
  nuovaSez(d){const s=newSezione(d.id);openSez(s.id)},
  apriSez(d){openSez(d.id)},
  back(){S.view=null;S.tab='trincee';render()},
  backUs(){S.view=null;S.tab='us';render()},
  apriUs(d){openUs(d.id)},
  apriUsNum(d){const sc=curScavo();const u=ensureUs(sc.id,d.n);openUs(u.id)},
  vediFoto(d){vediFoto(d.id)},

  rileggiFoto(d){const f=S.docs['foto/'+d.id];if(f){saveFoto({...f,id:d.id,stato:'da leggere',autore:me().username});render();setTimeout(processFoto,200)}},
  nuovaUs(){const sc=curScavo();const u=newUsRec(sc.id,nextUsNum(sc.id));openUs(u.id)}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&ACT[t.dataset.act]){e.preventDefault();ACT[t.dataset.act](t.dataset,t)}

addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(()=>{if(S.view==='sezione'){const s=S.docs['sezioni/'+S.openSez];if(s)previewSez({...s,id:S.openSez})}},150)});
